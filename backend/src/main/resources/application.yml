spring:
  application:
    name: GooShare
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gooshare}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 1024MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        api-key: ${AI_DASHSCOPE_API_KEY:}
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
          temperature: 0.3
      embedding:
        api-key: ${AI_DASHSCOPE_API_KEY:}
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: gooshare_knowledge
        initialize-schema: true
server:
  port: 8084

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:${OSS_ENDPOINT:}}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:}}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:}}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:${OSS_BUCKET_NAME:}}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
#  mapper-locations: classpath:com.itheima.mapper/*.xml

dify:
  base-url: ${DIFY_BASE_URL:http://localhost:5001/v1}
  api-key: ${DIFY_API_KEY:}
  api-type: ${DIFY_API_TYPE:chat}
  # 可选：workflow api key if needed separately
logging:
  file:
    name: logs/gooshare.log
  level:
    com.gooshare.agent.tool.AiShoppingTools: INFO
gooshare:
  rag:
    rebuild-on-startup: false
